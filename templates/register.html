<!DOCTYPE html>
<html>

<head>
  <title>Luo tunnus</title>
</head>

<body>
  <h1>Luo tunnus</h1>

  {% for message in get_flashed_messages() %}
  <p><b>{{ message }}</b></p>
  {% endfor %}

  <form action="/register" method="post">
    <p>
      <label for="username">Tunnus</label>: <br />
      <input type="text" name="username" id="username" value="{{ filled.username }}" maxlength="16" required />
    </p>
    <p>
      <label for="password1">Salasana</label>: <br />
      <input type="password" name="password1" id="password1" required />
    </p>
    <p>
      <label for="password2">Salasana uudestaan</label>: <br />
      <input type="password" name="password2" id="password2" required />
    </p>
    <input type="submit" value="Luo tunnus" />
  </form>
  <p><a href="/">Etusivu</a></p>
</body>

</html>
