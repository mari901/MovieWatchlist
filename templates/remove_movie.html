{% extends "layout.html" %}

{% block title %}Remove movie{% endblock %}

{% block content %}
<h2>Remove movie</h2>
<p>Are you sure you want to remove the movie {{ movie.title }}?</p>
<form action="/remove_movie/{{ movie.id }}" method="post">
  <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}" />
  <input type="submit" name="continue" value="Remove" />
  <input type="submit" name="cancel" value="Cancel" />
</form>
{% endblock %}
