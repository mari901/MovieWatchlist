{% extends "layout.html" %}

{% block title %}Movie Watchlist{% endblock %}

{% block content %}
<h2>Movies</h2>

{% for movie in movies %}
<div class="thread">
  <p>
    <a href="/movie/{{ movie.id }}">{{ movie.title }}</a> ({{ movie.release_year }})
  </p>
  <p>
    Added by: <a href="/user/{{ movie.user_id }}">{{ movie.username }}</a>
  </p>
</div>
{% else %}
<p>No movies yet.</p>
{% endfor %}
{% endblock %}
