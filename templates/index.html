{% extends "layout.html" %}

{% block title %}Movie Watchlist{% endblock %}

{% block content %}
<h2>Elokuvat</h2>

{% for movie in movies %}
<div class="thread">
  <p>
    <a href="/movie/{{ movie.id }}">{{ movie.title }}</a> ({{ movie.release_year }})
  </p>
  <p>
    Lisääjä: <a href="/user/{{ movie.user_id }}">{{ movie.username }}</a>
  </p>
</div>
{% else %}
<p>Ei vielä elokuvia.</p>
{% endfor %}
{% endblock %}
